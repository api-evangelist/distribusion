aid: distribusion
name: Distribusion
description: >-
  Distribusion is a Berlin-based ground transportation technology company that
  operates a global distribution system (GDS) for ground travel. Its B2B platform
  connects 2,000+ carriers - buses, trains, trams, and ferries - with 250+
  retailers and travel platforms including Google Maps, Expedia, Booking, and
  Trainline. The Distribusion Retailer API handles the full transaction lifecycle
  from search to settlement: inventory search, booking, payment, unified
  invoicing, channel management, real-time disruption management, and after-sales
  services. The platform supports the OSDM (Open Sales and Distribution Model)
  rail distribution standard and aims to make ground travel as accessible and
  bookable as flights. Backed by Creandum and Northzone.
