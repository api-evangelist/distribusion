generated: '2026-07-18'
method: searched
source: https://distribusion.com/llms.txt
status: published
notes: >-
  Live hosted MCP endpoint advertised in the provider's own /llms.txt. This is a
  Wix Site MCP server (their marketing/content site runs on Wix) exposing public
  site content and Wix business-solution actions - it is NOT the Distribusion
  Retailer product API. A GenerateVisitorToken call is required before other
  tools (the endpoint returned HTTP 401 to an unauthenticated probe, confirming
  it is live). No official MCP server for the Retailer API was found.
server:
  name: distribusion-site
  vendor: Wix
  transport: http
  url: https://www.distribusion.com/_api/mcp
  auth: visitor-token
  docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
tools:
  - name: GetBusinessDetails
    description: Retrieves business and site details such as timezone, email, phone, and address.
  - name: SearchInSite
    description: Searches the site for information.
  - name: SearchSiteApiDocs
    description: Retrieves API documentation for the Wix business solutions installed on this site.
  - name: GenerateVisitorToken
    description: Creates a new visitor session and obtains a visitor access token for the site.
  - name: CallWixSiteAPI
    description: Calls API methods on the site to perform actions on a visitor's behalf.
  - name: ReadFullDocsArticle
    description: Fetches a complete article from the Wix developer documentation portal.
  - name: ReadFullDocsMethodSchema
    description: Fetches the full schema for a Wix API method.
